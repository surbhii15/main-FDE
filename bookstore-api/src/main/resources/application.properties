spring.application.name=bookstore-api
server.port=${SERVER_PORT:8080}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USERNAME:bookstore}
spring.datasource.password=${DB_PASSWORD:bookstore}

# --- JPA / Flyway (schema is owned by Flyway migrations) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JSON ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Security / JWT ---
# Override JWT_SECRET in any shared environment (Base64, >= 256 bits).
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1ib29rc3RvcmUtY2Fwc3RvbmUtand0LWtleQ==}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- Business rules ---
app.orders.cancellation-window-hours=48
app.points.max-redeem-percent=50
app.points.earn-per-amount=10

# --- Seed users (created on startup if missing) ---
app.seed.enabled=${SEED_USERS:true}
app.seed.admin-email=admin@bookstore.local
app.seed.admin-password=${ADMIN_PASSWORD:Admin@123}
app.seed.customer-email=reader@bookstore.local
app.seed.customer-password=${CUSTOMER_PASSWORD:Reader@123}

# --- API docs ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
